<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#202124">
<title>SLVS FTTH Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#202124;--pan:#2b2c30;--pan2:#3a3b40;--txt:#eceef1;--mut:#9aa0a6;--acc:#76b900;--line:#45464b;--red:#ef5350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Roboto,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
button{font-family:inherit;cursor:pointer}
#map{position:absolute;inset:0;background:#e9e6df}
/* floating controls */
#tbar{position:fixed;top:10px;left:8px;z-index:900;background:#1e1f22;border-radius:6px;display:flex;box-shadow:0 2px 8px #0007}
#tbar button{width:46px;height:46px;border:0;background:none;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.round{position:fixed;z-index:900;width:58px;height:58px;border-radius:50%;border:0;background:#1e1f22;color:#fff;box-shadow:0 2px 8px #0008;display:flex;align-items:center;justify-content:center;font-size:24px}
.round.on{background:var(--acc);color:#000}
#bLoc{top:6px;right:10px}
#bAdd{right:12px;bottom:18px;font-size:19px;font-weight:700}
#tools{position:fixed;left:8px;top:66px;z-index:900;display:flex;flex-direction:column;gap:8px}
#tools button{width:44px;height:44px;border-radius:50%;border:0;background:#1e1f22;color:#fff;font-size:18px;box-shadow:0 2px 6px #0007}
#tools button.on{background:var(--acc);color:#000}
#tools button.rec{background:#c62828;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
#gpsbar{position:fixed;top:62px;right:10px;z-index:890;background:#1e1f22e0;color:#fff;font-size:11.5px;padding:4px 8px;border-radius:10px;display:none;text-align:right;line-height:1.35}
#hint{position:fixed;left:60px;right:60px;top:66px;z-index:880;background:#000c;color:#fff;font-size:13px;padding:7px 12px;border-radius:8px;display:none;text-align:center}
#hint button{margin-left:6px;border:0;border-radius:6px;background:var(--acc);color:#000;font-weight:700;padding:4px 8px}
/* placement */
#place{display:none}
body.placing #place{display:block}
body.placing #tbar,body.placing #bAdd,body.placing #tools,body.placing #info{display:none!important}
#pBanner{position:fixed;top:0;left:0;right:0;z-index:950;background:#1e1f22ee;color:#fff;font-size:13.5px;text-align:center;padding:10px 70px 10px 12px;font-weight:600}
#pChips{position:fixed;top:56px;left:0;right:70px;z-index:950;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.pchip{background:#2b2c30;color:#fff;border:0;border-radius:6px;padding:9px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 6px #0007}
.pchip.off{opacity:.55;text-decoration:line-through}
#cross{position:fixed;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:940;pointer-events:none}
#pTypes{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:950;display:flex;flex-direction:column;gap:8px}
#pTypes button{display:flex;align-items:center;gap:6px;border:0;border-radius:24px;background:#1e1f22;color:#fff;padding:0 12px 0 4px;height:42px;font-size:12.5px;font-weight:600;box-shadow:0 2px 6px #0007}
#pTypes button i{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#fff}
#pTypes button.on{outline:3px solid var(--acc)}
#pBottom{position:fixed;left:0;right:0;bottom:22px;z-index:950;display:flex;flex-direction:column;align-items:center;gap:8px}
#pBtns{display:flex;gap:6px}
#pBtns button{border:0;border-radius:6px;background:#2b2c30;color:#fff;font-weight:700;font-size:15px;padding:13px 18px;box-shadow:0 2px 6px #0007}
#pBtns button.ok{background:var(--acc);color:#000}
#pCoord{background:#2b2c30;color:#fff;border-radius:6px;padding:6px 14px;font-size:13.5px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px #0007}
#pDist{font-size:11.5px;color:#cde;font-weight:500}
/* pins */
.pin{position:relative;width:30px;height:40px}
.pin svg{display:block;filter:drop-shadow(0 1px 1.5px #0009)}
.pin.sel svg{transform:scale(1.25);transform-origin:50% 100%}
.lb{position:absolute;left:27px;top:4px;white-space:nowrap;font-weight:700;font-size:13px;line-height:1.15;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff;pointer-events:none}
.lb small{display:block;font-size:10.5px;color:#123;font-weight:700}
.sat .lb{text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}
.sat .lb small{color:#fff}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #0009}
.dot.sel{outline:3px solid #ffd600}
.dot .lb{left:14px;top:-3px;font-size:11px}
.gpsdot{width:18px;height:18px;border-radius:50%;background:#2979ff;border:3px solid #fff;box-shadow:0 0 0 2px #2979ff66,0 1px 4px #0008}
.leaflet-tooltip.llbl{background:#fffd;color:#004d5a;border:0;font-size:10.5px;padding:1px 4px;box-shadow:none;font-weight:700}
.leaflet-tooltip.llbl:before{display:none}
/* info panel */
#info{position:fixed;left:0;right:0;bottom:0;z-index:960;background:#1e1f22;display:none;box-shadow:0 -2px 10px #0008}
#info.show{display:flex}
#iTxt{flex:1;padding:10px 12px;max-height:118px;overflow:hidden;font-size:14px;line-height:1.3;cursor:pointer;min-width:0}
#info.big #iTxt{max-height:62vh;overflow-y:auto}
#iTxt .t{font-weight:700;font-size:15px}
#iTxt .d{white-space:pre-wrap;color:#e0e0e0}
#iTxt .f{color:#b9f6ca;font-size:12.5px;margin-top:3px}
#iBtns{display:grid;grid-template-columns:48px 48px;grid-auto-rows:48px;padding:4px 4px 4px 0;align-content:start}
#iBtns button{border:0;background:none;color:#fff;font-size:21px}
/* full-screen page */
#page{position:fixed;inset:0;z-index:1500;background:var(--bg);display:none;flex-direction:column}
#page.show{display:flex}
#pgHead{display:flex;align-items:center;gap:4px;margin:8px;background:#2b2c30;border-radius:6px;min-height:50px;padding:0 4px}
#pgHead .ttl{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.hb{border:0;background:none;color:#fff;font-size:21px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#pgBody{flex:1;overflow-y:auto;padding:0 8px 30px}
.box{background:#2b2c30;border-radius:6px;padding:12px 14px;margin-bottom:8px}
.box h5{margin:0 0 8px;font-size:15px;font-weight:600}
label.f{display:block;margin:10px 0 4px;font-size:12.5px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #5f6368;border-radius:4px;font-size:15px;background:#2b2c30;color:var(--txt);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical;min-height:120px;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sq{width:50px;height:50px;border-radius:4px;border:0;background:#3a3b40;color:#fff;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.sqs{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.pal{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.pal::-webkit-scrollbar{display:none}
.pal button{flex:none;width:44px;height:40px;border:0;border-radius:3px}
.pal button.on{transform:scale(1.15);outline:3px solid #fff}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs img{width:76px;height:76px;object-fit:cover;border-radius:4px}
.btn{border:0;background:#3a3b40;color:#fff;border-radius:6px;padding:10px 13px;font-size:14px;font-weight:600}
.btn.p{background:var(--acc);color:#000}
.btn.d{background:#5c2b2b;color:#ffcdd2}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv b{color:var(--mut);font-weight:500}
.kv span{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.card{background:#35363b;border-radius:6px;padding:7px 9px}
.card .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.card .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700}
.ok{background:#1b5e20;color:#c8e6c9}.warn{background:#7a5a00;color:#fff3c4}.low{background:#8e1c1c;color:#ffd7d7}.high{background:#a8430f;color:#ffe0cc}.none{background:#455a64;color:#eceff1}
.muted{color:var(--mut);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:11.5px}
tr.click td{cursor:pointer}
.spl{display:grid;grid-template-columns:1fr 18px 1fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.spl select{padding:8px 6px;font-size:14px}
.spl .x{border:0;background:#3a3b40;color:#fff;border-radius:4px;height:36px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:46px;padding:10px 0;border:0;border-radius:4px;background:#3a3b40;color:#fff;font-weight:700;font-size:14px}
.seg button.on{background:var(--acc);color:#000}
.cores{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:4px 0 8px}
.cores button{height:38px;border-radius:8px;border:2px solid #0008;font-weight:800;font-size:14px}
.cores button.on{outline:3px solid #fff;outline-offset:2px}
.clist{background:#232427;border-radius:6px;padding:4px 8px;margin:6px 0 8px}
.crow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #3a3b40}
.crow:last-child{border-bottom:0}
.crow .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff6;flex:none}
.crow .no{width:22px;font-weight:800;text-align:right}
.crow .nm{flex:1;font-weight:600}
.crow.w .nm{color:#b9f6ca}
.tg{position:relative;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);font-weight:700;cursor:pointer}
.tg input{display:none}
.tg i{width:40px;height:22px;border-radius:11px;background:#5f6368;position:relative;transition:.15s}
.tg i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tg input:checked+i{background:var(--acc)}
.tg input:checked+i:after{left:21px}
.tg input:checked~span{color:#b9f6ca}
.thd{font-size:12px;color:var(--mut);font-weight:700;padding:8px 0 2px;display:flex;align-items:center;gap:6px}
.tl{position:relative;padding-left:4px}
.tn{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.tn .ic{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;border:2px solid #fff8;font-size:13px}
.tn b{font-size:14.5px}
.ts{display:flex;gap:10px;align-items:stretch;min-height:44px}
.ts .bar{width:30px;flex:none;display:flex;justify-content:center}
.ts .bar i{width:8px;border-radius:4px;border:1px solid #0008}
.ts .tx{padding:6px 0;font-size:13px;color:#d6d8db;line-height:1.45}
.chip2{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:18px;background:#3a3b40;color:#fff;padding:6px 11px;margin:3px;font-weight:700;font-size:13px}
.chip2.on{outline:3px solid var(--acc)}
.st3{display:flex;gap:3px;flex:none}
.st3 button{border:0;border-radius:4px;padding:7px 9px;font-weight:800;font-size:12px;background:#3a3b40;color:#9aa0a6;min-width:34px}
.st3 button.on.w{background:#2e7d32;color:#fff}.st3 button.on.s{background:#546e7a;color:#fff}.st3 button.on.f{background:#c62828;color:#fff}
.crow.w .nm{color:#b9f6ca}.crow.f .nm{color:#ff8a80;text-decoration:line-through}
.crow .lbl{flex:1;min-width:0;padding:6px 8px;font-size:13px}
.crow .nmw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.legend{font-size:11.5px;color:var(--mut);margin:2px 0 4px}
.log{font-size:12.5px;color:#d6d8db;border-left:3px solid #ff7043;padding:2px 8px;margin:4px 0}
.cdot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid #fff8}
/* drawer */
#scrim{position:fixed;inset:0;background:#0009;z-index:1400;display:none}
#scrim.show{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:340px;background:#1e1f22;z-index:1450;transform:translateX(-105%);transition:transform .2s;overflow-y:auto}
#drawer.show{transform:none}
.dsec{background:#5f6368;color:#fff;padding:7px 16px;font-size:14px;font-weight:600}
.ditem{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid #2f3034;cursor:pointer}
.ditem .ic{width:24px;text-align:center;font-size:19px}
.ditem .tx{flex:1;font-size:15px;font-weight:600}
.ditem .tx small{display:block;font-size:11.5px;color:var(--mut);font-weight:500}
.ditem input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
/* dialog */
#modal{position:fixed;inset:0;background:#0009;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#mBox{background:#2b2c30;width:100%;max-width:440px;border-radius:6px;padding:16px 18px;max-height:88vh;overflow-y:auto}
#mBox h3{margin:0 0 10px;font-size:17px;font-weight:600}
.mitem{display:flex;gap:16px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.mitem .ic{width:26px;text-align:center;font-size:20px}
.mitem b{display:block;font-size:15px}
.mitem small{color:#c6c9cd;font-size:12px}
.mfoot{text-align:right;margin-top:10px}
.mfoot button{border:0;background:none;color:#fff;font-weight:700;font-size:14px;padding:8px 10px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:6px;font-size:13.5px;z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 2px 8px #0008}
#toast.show{opacity:1}
#imgView{position:fixed;inset:0;background:#000;z-index:2500;display:none;align-items:center;justify-content:center;flex-direction:column}
#imgView.show{display:flex}
#imgView img{max-width:100%;max-height:85vh}
#fail{display:none;position:absolute;inset:0;background:var(--bg);padding:30px;z-index:5000;font-size:15px}
</style>
</head>
<body>
<div id="map"></div>
<div id="fail"><h3>Map could not load</h3><p>The map needs an internet connection (map library and map tiles). Turn on mobile data or Wi‑Fi and reopen the app.</p><p class="muted">Your markers are kept on this phone.</p></div>

<div id="tbar">
  <button id="tMenu" title="Menu">☰</button>
  <button id="tFilter" title="Filter">⏷</button>
  <button id="tList" title="List">☷</button>
  <button id="tSearch" title="Search">🔍</button>
  <button id="tShare" title="Share / export">⇪</button>
</div>
<button class="round" id="bLoc" title="My location">◎</button>
<div id="gpsbar"></div>
<div id="tools">
  <button id="xMeas" title="Measure distance">📏</button>
  <button id="xCut" title="Fiber cut – add joint">✂️</button>
  <button id="xRec" title="Walk &amp; record route">⏺</button>
  <button id="xLbl" title="Power labels">dB</button>
</div>
<div id="hint"></div>
<button class="round" id="bAdd" title="Add marker">+📍</button>

<div id="place">
  <div id="pBanner">Move the map around to place your marker where you want and click OK to place it.</div>
  <div id="pChips"><button class="pchip" id="pFolder">📁 Default folder</button><button class="pchip" id="pConn">🔗 —</button></div>
  <svg id="cross" viewBox="0 0 46 46"><circle cx="23" cy="23" r="15" fill="none" stroke="#000" stroke-width="3"/><circle cx="23" cy="23" r="15" fill="none" stroke="#fff" stroke-width="1" opacity=".7"/><path d="M23 2v14M23 30v14M2 23h14M30 23h14M12 12l7 7M34 12l-7 7M12 34l7-7M34 34l-7-7" stroke="#000" stroke-width="3" stroke-linecap="round"/></svg>
  <div id="pTypes"></div>
  <div id="pBottom">
    <div id="pBtns"><button id="pCancel">Cancel</button><button id="pGps">◎ GPS</button><button class="ok" id="pOk">OK</button></div>
    <div id="pCoord"></div>
  </div>
</div>

<div id="info"><div id="iTxt"></div><div id="iBtns">
  <button id="iEdit" title="Edit">✏️</button><button id="iCopy" title="Copy">⧉</button>
  <button id="iNav" title="Navigate">➤</button><button id="iMore" title="More">⋮</button></div></div>

<div id="page"><div id="pgHead"></div><div id="pgBody"></div></div>
<div id="scrim"></div><div id="drawer"></div>
<div id="modal"><div id="mBox"></div></div>
<div id="imgView"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<input type="file" id="imgIn" accept="image/*" multiple style="display:none">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ============ constants ============ */
const TYPES={
  olt:  {label:'OLT / Source',  short:'OLT',    color:'#e53935',icon:'⚡',pre:'OLT-'},
  sw:   {label:'Switch / SFP source',short:'Switch',color:'#ff7043',icon:'⇄',pre:'SW-'},
  liu:  {label:'LIU / ODF patch panel',short:'LIU',color:'#3949ab',icon:'▤',pre:'LIU-'},
  pole: {label:'Route point / Pole',short:'Pole',color:'#607d8b',icon:'•',pre:'P-'},
  joint:{label:'Joint / Splice',short:'Joint',  color:'#76b900',icon:'✚',pre:'Joint-'},
  fbt:  {label:'FBT Coupler',   short:'Coupler',color:'#1e88e5',icon:'C',pre:'CPL-'},
  plc:  {label:'PLC Splitter',  short:'Splitter',color:'#8e24aa',icon:'S',pre:'SPL-'},
  ont:  {label:'ONT / Customer',short:'ONT',    color:'#00897b',icon:'⌂',pre:'ONT-'},
  mark: {label:'Plain marker',  short:'Marker', color:'#fb8c00',icon:'',pre:'M-'}
};
/* FBT insertion loss (1310 & 1550 nm) dB : [Port1 = first %, Port2 = second %] */
const FBT_TABLE={'50/50':[3.2,3.2],'60/40':[2.5,4.4],'70/30':[1.7,5.7],'20/80':[7.6,1.1],'10/90':[11.0,0.49],'5/95':[14.0,0.25]};
const FBT=Object.keys(FBT_TABLE);
const PLC={'1x2':3.01,'1x4':6.02,'1x8':9.03,'1x16':12.04,'1x32':15.05,'1x64':18.06};
const WL={'1310':0.35,'1490':0.28,'1550':0.25};
const FIBER=[['Blue','#1e64ff'],['Orange','#ff8a00'],['Green','#2e9e3e'],['Brown','#8d5524'],['Slate','#8a9aa5'],['White','#ffffff'],['Red','#e53935'],['Black','#111111'],['Yellow','#ffe600'],['Violet','#8e24aa'],['Rose','#f48fb1'],['Aqua','#26c6da'],['Natural','#e8dcc0']];
const FCOL=Object.fromEntries(FIBER);
const CORES=[1,2,4,6,12,24];
const SRC=new Set(['olt','sw']);
const LIU_P=[6,12,24];
const LIGHT=['White','Yellow','Natural','Aqua','Rose','Slate'];
const coreCol=i=>FIBER[i%12][1];
function coreLabel(i,cores){if(i==null)return '';const c=FIBER[i%12][0];return 'Core '+(i+1)+' '+c+((cores||0)>12?' (tube '+(i<12?'1 Blue':'2 Orange')+')':'');}
function wk(n){const w=Array.isArray(n.work)?n.work:(n.core!=null?[n.core]:[]);return w.filter(i=>i<(n.cores||0)).sort((a,b)=>a-b);}
function workText(n){const w=wk(n);return w.length?w.map(i=>(i+1)+' '+FIBER[i%12][0]).join(', '):'';}
function cableText(n){if(!n.cores)return '';const w=wk(n),b=bad(n);return n.cores+'F'+(w.length?' · working '+w.length+'/'+n.cores+': '+workText(n):' · no working core')+(b.length?' · FAULTY: '+b.map(i=>(i+1)+' '+FIBER[i%12][0]).join(', '):'');}
function bad(n){return (Array.isArray(n.bad)?n.bad:[]).filter(i=>i<(n.cores||0)).sort((a,b)=>a-b);}
function stOf(o,i){return (o.bad||[]).includes(i)?'f':(o.work||[]).includes(i)?'w':'s';}
function setSt(o,i,v){o.work=(o.work||[]).filter(x=>x!==i);o.bad=(o.bad||[]).filter(x=>x!==i);if(v==='w')o.work.push(i);if(v==='f')o.bad.push(i);o.work.sort((a,b)=>a-b);o.bad.sort((a,b)=>a-b);}
function stCount(o,n){const w=(o.work||[]).filter(i=>i<n).length,f=(o.bad||[]).filter(i=>i<n).length;return `<b style="color:#b9f6ca">${w} working</b> · ${n-w-f} spare · <b style="color:#ff8a80">${f} faulty</b>`;}
function coreList(cores,o,attr,labels){
  let h='<div class="legend">W = working · S = spare · F = faulty / damaged</div><div class="clist">';
  for(let i=0;i<cores;i++){
    if(cores>12&&i%12===0)h+=`<div class="thd"><span class="cdot" style="background:${FIBER[i/12][1]}"></span>${labels?'Ports':'Tube'} ${i/12+1} – ${FIBER[i/12][0]}</div>`;
    const st=stOf(o,i);
    const nm=`<span class="nm">${FIBER[i%12][0]}</span>`;
    h+=`<div class="crow ${st}"><span class="sw" style="background:${coreCol(i)}"></span><span class="no">${i+1}</span>${labels?`<div class="nmw">${nm}<input class="lbl" data-lbl="${i}" placeholder="goes to…" value="${esc(labels[i]||'')}"></div>`:nm}
      <div class="st3">${['w','s','f'].map(v=>`<button ${attr}="${i}" data-v="${v}" class="${v}${st===v?' on':''}">${v.toUpperCase()}</button>`).join('')}</div></div>`;
  }

}
function bindCoreList(attr,o,after){

    const row=b.closest('.crow');row.className='crow '+b.dataset.v;row.querySelectorAll('.st3 button').forEach(x=>x.classList.toggle('on',x===b));if(after)after();});
}

let idb=null;
function db(){return idb||(idb=new Promise((res,rej)=>{try{const r=indexedDB.open('slvs_ftth_img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}}));}

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72));};im.onerror=rej;im.src=u;});}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d)=>(v===''||v==null||isNaN(+v))?d:+v;
const fmtD=m=>m==null?'—':(m<1000?m.toFixed(1)+' m':(m/1000).toFixed(3)+' km');

function hav(a,b){const R0=6371008.8,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLn=(b.lng-a.lng)*r;const s=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLn/2)**2;return 2*R0*Math.asin(Math.min(1,Math.sqrt(s)));}
function proj(p,a,b){const k=Math.cos(a.lat*Math.PI/180),ax=a.lng*k,ay=a.lat,dx=b.lng*k-ax,dy=b.lat-ay;let t=((p.lng*k-ax)*dx+(p.lat-ay)*dy)/((dx*dx+dy*dy)||1e-18);t=Math.max(0,Math.min(1,t));return {lat:ay+t*dy,lng:(ax+t*dx)/k,t};}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600);}
function fbtParts(r){const p=String(r||'50/50').split('/').map(Number);return [p[0]||50,p[1]||50];}
function fbtLoss(n,port){const i=port?1:0,o=i?n.l2:n.l1;if(o!=null&&o!==''&&isFinite(+o))return +o;const t=FBT_TABLE[n.ratio];if(t)return t[i];return -10*Math.log10(fbtParts(n.ratio)[i]/100)+0.3;}
function nodeLoss(n,port){const s=S.set;switch(n.type){case 'olt':case 'sw':return s.connLoss;case 'liu':return num(n.loss,s.connLoss);case 'joint':return num(n.loss,s.spliceLoss);case 'plc':return num(n.loss,PLC[n.ratio]||0);case 'fbt':return fbtLoss(n,port);case 'ont':return s.connLoss;default:return 0;}}
function ports(n){if(n.type==='fbt')return 2;if(n.type==='plc')return parseInt(String(n.ratio).split('x')[1])||2;return 0;}
function portLabel(p,port){if(!p)return '';if(p.type==='fbt'){const f=fbtParts(p.ratio);return 'Port'+(port?2:1)+' '+(port?f[1]:f[0])+'%';}if(p.type==='plc')return 'Port '+((port||0)+1);return '';}
function status(rx){if(rx==null)return 'none';const s=S.set;if(rx>s.overload)return 'high';if(rx<s.sens)return 'low';if(rx<s.sens+s.margin)return 'warn';return 'ok';}
const STXT={ok:'OK',warn:'Low margin',low:'Too low',high:'Too high',none:'No source'};
const SCOL={ok:'#2e7d32',warn:'#f9a825',low:'#c62828',high:'#e65100',none:'#78909c'};
const folderName=id=>(S.folders.find(f=>f.id===id)||S.folders[0]).name;
const visible=n=>{const f=S.folders.find(f=>f.id===n.folder);return (!f||f.vis!==false)&&!S.hide[n.type];};
function splText(n){return (n.splices||[]).map(s=>s.a+' to '+s.b.toLowerCase()).join('\n');}

/* ============ power & distance engine ============ */
function compute(){
  const by={},kids={},C={},st=S.set;
  S.nodes.forEach(n=>by[n.id]=n);
  S.nodes.forEach(n=>{if(SRC.has(n.type))n.parent=null;if(n.parent&&by[n.parent])(kids[n.parent]||(kids[n.parent]=[])).push(n);});
  const stack=[];
  S.nodes.forEach(n=>{if(!n.parent||!by[n.parent])stack.push([n,SRC.has(n.type)?num(n.power,n.type==='sw'?st.swPower:st.oltPower):null,0,0,n.id]);});
  while(stack.length){
    const [n,pin,dist,seg,root]=stack.pop();if(C[n.id])continue;
    let out;
    if(pin==null)out=[null,null];
    else if(n.type==='fbt')out=[pin-fbtLoss(n,0),pin-fbtLoss(n,1)];
    else out=[pin-nodeLoss(n,0)];
    const c={dist,seg,pin,out,root,rx:n.type==='ont'&&pin!=null?pin-st.connLoss:null};C[n.id]=c;
    (kids[n.id]||[]).forEach(k=>{const s=segLen(n,k),po=out[n.type==='fbt'?(k.port?1:0):0];stack.push([k,po==null?null:po-s/1000*st.lossKm,dist+s,s,root]);});
  }
  return {C,by,kids};
}
function segLen(p,n){return (n.len!=null&&n.len!==''&&isFinite(+n.len))?+n.len:hav(p,n);}
function pathTo(n){const p=[],seen=new Set();let c=n;while(c&&!seen.has(c.id)){seen.add(c.id);p.unshift(c);c=c.parent?R.by[c.parent]:null;}return p;}
function isDesc(a,b){let c=a,seen=new Set();while(c&&!seen.has(c.id)){if(c.id===b.id)return true;seen.add(c.id);c=c.parent?R.by[c.parent]:null;}return false;}
function fiberBetween(a,b){const ids=new Set(pathTo(a).map(n=>n.id));let c=b,seen=new Set();
  while(c&&!seen.has(c.id)){if(ids.has(c.id)){const ca=R.C[a.id],cb=R.C[b.id],cl=R.C[c.id];return ca&&cb&&cl?ca.dist+cb.dist-2*cl.dist:null;}seen.add(c.id);c=c.parent?R.by[c.parent]:null;}return null;}
function nextPort(p){const n=ports(p);if(!n)return 0;const used=new Set((R.kids[p.id]||[]).map(k=>k.port||0));for(let i=0;i<n;i++)if(!used.has(i))return i;return -1;}

function pinColor(n,c){if(n.color)return n.color;if(n.type==='ont')return SCOL[status(c&&c.rx)];return (TYPES[n.type]||TYPES.mark).color;}
function powerShort(n,c){if(!c)return '';const v=n.type==='ont'?c.rx:SRC.has(n.type)?c.out[0]:c.pin;if(v==null||n.type==='mark')return '';return (n.type==='ont'?'Rx ':SRC.has(n.type)?'Tx ':'')+v.toFixed(1)+' dBm';}
function render(){
  R=compute();const {C,by}=R;
  lineLayer.clearLayers();mkLayer.clearLayers();
  const hl=new Set();if(sel&&by[sel])pathTo(by[sel]).forEach(n=>hl.add(n.id));
  S.nodes.forEach(n=>{
    if(!(n.parent&&by[n.parent])||!visible(n))return;const p=by[n.parent],on=hl.has(n.id),c=C[n.id];

    if(tc){const tcol=traceMap[n.id]!=null?coreCol(traceMap[n.id]):'#9e9e9e';
      L.polyline(ll,{color:'#000',weight:11,opacity:.6,interactive:false}).addTo(lineLayer);
      const tl=L.polyline(ll,{color:tcol,weight:7,opacity:1,interactive:false}).addTo(lineLayer);
      if(traceMap[n.id]!=null)tl.bindTooltip((traceMap[n.id]+1)+' '+FIBER[traceMap[n.id]%12][0],{permanent:true,direction:'center',className:'llbl'});
      L.polyline(ll,{weight:26,opacity:0}).addTo(lineLayer).on('click',e=>{L.DomEvent.stop(e);onLine(n,e.latlng);});return;}
    const lc=on?'#ffd600':(n.cores&&wk(n).length?coreCol(wk(n)[0]):(c&&c.pin==null?'#90a4ae':'#00b8d4'));
    const ln=L.polyline(ll,{color:lc,weight:on?6:4,opacity:.95,interactive:false}).addTo(lineLayer);
    const tt=[];if(S.set.showCable&&n.cores)tt.push(n.cores+'F'+(wk(n).length?' ('+wk(n).length+'W'+(bad(n).length?' '+bad(n).length+'✗':'')+')':(bad(n).length?' ('+bad(n).length+'✗)':'')));if(S.set.showLen&&c)tt.push(fmtD(c.seg)+(n.len!=null?'*':''));
    if(tt.length)ln.bindTooltip(tt.join(' · '),{permanent:true,direction:'center',className:'llbl'});
    L.polyline(ll,{weight:26,opacity:0}).addTo(lineLayer).on('click',e=>{L.DomEvent.stop(e);onLine(n,e.latlng);});
  });
  S.nodes.forEach(n=>{
    if(!visible(n))return;
    const c=C[n.id],col=pinColor(n,c),t=TYPES[n.type]||TYPES.mark,isSel=sel===n.id;

    }else{
      ic=L.divIcon({className:'',iconSize:[30,40],iconAnchor:[15,39],html:`<div class="pin${isSel?' sel':''}"><svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 39C15 39 2.5 23.5 2.5 14a12.5 12.5 0 0 1 25 0c0 9.5-12.5 25-12.5 25z" fill="${col}" stroke="#0007" stroke-width="1.2"/><circle cx="15" cy="14" r="6.3" fill="#151515"/>${t.icon&&t.icon!=='•'?`<text x="15" y="17.6" font-size="9" text-anchor="middle" fill="#fff" font-weight="700" font-family="sans-serif">${t.icon}</text>`:''}</svg><span class="lb" style="color:${col}">${esc(n.name)}${pw?`<small>${pw}</small>`:''}</span></div>`});
    }
    L.marker([n.lat,n.lng],{icon:ic,zIndexOffset:n.type==='pole'?0:(isSel?1000:500)}).addTo(mkLayer).on('click',e=>{L.DomEvent.stop(e);onNode(n);});
  });
  renderInfo();save();
}

});

function changeCoreDlg(child){
  const p=R.by[child.parent];if(!p||!child.cores)return;
  const w=wk(child),b=bad(child);let from=w[0],to=null;
  const spare=()=>Array.from({length:child.cores},(_,i)=>i).filter(i=>!wk(child).includes(i)&&!bad(child).includes(i));
  const chip=(i,on,attr)=>`<button class="chip2${on?' on':''}" ${attr}="${i}"><span class="cdot" style="background:${coreCol(i)};margin:0"></span>${i+1} ${FIBER[i%12][0]}</button>`;
  const draw=()=>{
    const sp=spare(),inSec=section(child).length;
    const oc=from!=null?FIBER[from%12][0]:'',nc=to!=null?FIBER[to%12][0]:'';
    modal(`<h3>🔁 Change core</h3><p class="muted">Fiber ${esc(p.name)} → ${esc(child.name)} · ${child.cores}F. Use this when a working core is damaged between two points and you move the line to a spare core.</p>
     <label class="f">Damaged core (now working)</label><div>${(w.length?w:Array.from({length:child.cores},(_,i)=>i)).map(i=>chip(i,i===from,'data-cf')).join('')}</div>
     <label class="f">Change to spare core</label><div>${sp.length?sp.map(i=>chip(i,i===to,'data-ct')).join(''):'<span class="muted">No spare core in this cable</span>'}</div>
     ${inSec?`<label class="mitem" style="border:0"><input type="checkbox" id="cSec" checked style="width:20px;height:20px;flex:none;accent-color:var(--acc)"><span>Whole cable section (${inSec+1} segments through route points)</span></label>`:''}
     <label class="mitem" style="border:0"><input type="checkbox" id="cSpl" checked style="width:20px;height:20px;flex:none;accent-color:var(--acc)"><span>Update joint splices / LIU ports at both ends</span></label>
     <label class="f">Reason / note</label><input id="cNote" placeholder="e.g. core broken near pole 12">
     ${from!=null&&to!=null?`<div class="box" style="margin-top:10px;background:#35363b">Result: <b style="color:#ff8a80">${from+1} ${oc}</b> → faulty, <b style="color:#b9f6ca">${to+1} ${nc}</b> → working.<br><span class="muted">Start joint: ${oc} to ${nc.toLowerCase()} · end joint: ${nc} to ${oc.toLowerCase()} (rest of the route stays on ${oc}).</span></div>`:''}
     <div class="mfoot"><button data-close>CANCEL</button><button id="cOk" style="color:var(--acc)" ${from==null||to==null?'disabled':''}>CHANGE CORE</button></div>`);
    document.querySelectorAll('[data-cf]').forEach(x=>x.onclick=()=>{from=+x.dataset.cf;if(to===from)to=null;draw();});
    document.querySelectorAll('[data-ct]').forEach(x=>x.onclick=()=>{to=+x.dataset.ct;draw();});
    $('cOk').onclick=()=>{if(from==null||to==null)return;doChangeCore(child,from,to,$('cSec')?$('cSec').checked:false,$('cSpl').checked,$('cNote').value);};
  };
  draw();
}
function doChangeCore(child,from,to,whole,spl,note){
  const segs=[child].concat(whole?section(child):[]).filter(x=>x.cores&&to<x.cores);
  const ids=new Set(segs.map(x=>x.id));
  segs.forEach(x=>{const o={work:wk(x),bad:bad(x)};setSt(o,from,'f');setSt(o,to,'w');x.work=o.work;x.bad=o.bad;delete x.core;});
  const oc=FIBER[from%12][0],nc=FIBER[to%12][0],msg=[];
  if(spl){
    let top=null;segs.forEach(x=>{const p=R.by[x.parent];if(p&&!ids.has(p.id))top=p;});
    const bottoms=segs.filter(x=>!(R.kids[x.id]||[]).some(k=>ids.has(k.id)));
    if(top){
      if(top.type==='joint'){top.splices=top.splices||[];const sp=top.splices.find(z=>z.b===oc);if(sp)sp.b=nc;else top.splices.push({a:oc,b:nc});msg.push(top.name+': '+(sp?sp.a:oc)+' to '+nc.toLowerCase());}
      else if(top.type==='liu'){const o=top.lport||(top.lport={work:[],bad:[],lbl:[]});if(to<(top.lp||12)){o.lbl=o.lbl||[];o.lbl[to]=o.lbl[from]||o.lbl[to]||'';setSt(o,from,'f');setSt(o,to,'w');msg.push(top.name+': patch moved to port '+(to+1));}}
    }
    bottoms.forEach(bn=>{if(bn.type==='joint'){bn.splices=bn.splices||[];const sp=bn.splices.find(z=>z.a===oc);if(sp)sp.a=nc;else bn.splices.push({a:nc,b:oc});msg.push(bn.name+': '+nc+' to '+(sp?sp.b:oc).toLowerCase());}});
  }
  const t=`Core ${from+1} ${oc} → ${to+1} ${nc}`+(note?' – '+note:'')+(msg.length?' ['+msg.join('; ')+']':'');
  (child.log=child.log||[]).push({d:new Date().toISOString(),t});
  closeModal();sel=child.id;render();toast(`Changed ${oc} → ${nc} on ${segs.length} segment(s)`);
}
function coreGrid(cores,cur){let h='';for(let t=0;t<Math.ceil(cores/12);t++){if(cores>12)h+=`<div class="muted">Tube ${t+1} – ${FIBER[t][0]}</div>`;h+='<div class="cores">';
  for(let i=t*12;i<Math.min(cores,t*12+12);i++)h+=`<button data-core="${i}" class="${cur===i?'on':''}" style="background:${coreCol(i)};color:${LIGHT.includes(FIBER[i%12][0])?'#000':'#fff'}">${i+1}</button>`;h+='</div>';}return h;}
function section(child){
  const out=[],seen=new Set([child.id]);let p=R.by[child.parent];
  while(p&&p.type==='pole'&&p.parent&&R.by[p.parent]&&!seen.has(p.id)){seen.add(p.id);out.push(p);p=R.by[p.parent];}
  const st=[child];while(st.length){const x=st.pop();if(x.type!=='pole')continue;(R.kids[x.id]||[]).forEach(k=>{if(!seen.has(k.id)){seen.add(k.id);out.push(k);st.push(k);}});}
  return out;
}
function fiberDlg(child,ll){
  const p=R.by[child.parent];if(!p)return;

     <label class="f">Cable cores</label><div class="seg">${CORES.map(x=>`<button data-cc="${x}" class="${f.cores===x?'on':''}">${x}F</button>`).join('')}</div>
     ${f.cores?`<label class="f">Core colours – ${f.cores}F · <span id="fWn">${stCount(f,f.cores)}</span></label>${coreList(f.cores,f,'data-cs')}
       <div class="btns" style="margin-top:0"><button class="btn" id="fWall">All working</button><button class="btn" id="fWnone">All spare</button>${f.work.length?'<button class="btn" id="fChg" style="background:#ff7043;color:#000">🔁 Change core</button>':''}</div>`:''}
     <label class="f">Fiber length (m)</label><div class="row2"><input id="fLen" type="number" step="0.1" placeholder="${gl.toFixed(1)} (GPS)" value="${f.len}"><button class="btn" id="fGps">Use GPS ${fmtD(gl)}</button></div>
     <div class="muted">GPS straight line is ${fmtD(gl)}. Type the real cable length (slack, loops, poles) to use it for distance and loss.</div>
     <label class="mitem" style="border:0"><input type="checkbox" id="fAll" style="width:20px;height:20px;flex:none;accent-color:var(--acc)"><span>Same cable &amp; core for the whole section (through route points)</span></label>
     ${ll?mitem('✂️','Fiber cut here','Add a splice joint at this point','mCut')+mitem('➕','Add bend point here','Route point on the fiber','mPole'):''}
     <div class="mfoot"><button data-close>CANCEL</button><button id="fOk" style="color:var(--acc)">SAVE</button></div>`);
    const keep=()=>{f.len=$('fLen').value;};
    document.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{keep();const v=+b.dataset.cc;f.cores=f.cores===v?null:v;f.work=f.work.filter(i=>f.cores&&i<f.cores);f.bad=f.bad.filter(i=>f.cores&&i<f.cores);draw();});
    bindCoreList('data-cs',f,()=>{$('fWn').innerHTML=stCount(f,f.cores);});
    if($('fWall'))$('fWall').onclick=()=>{keep();f.work=Array.from({length:f.cores},(_,i)=>i).filter(i=>!f.bad.includes(i));draw();};
    if($('fWnone'))$('fWnone').onclick=()=>{keep();f.work=[];f.bad=[];draw();};
    if($('fChg'))$('fChg').onclick=()=>{keep();save1(false);changeCoreDlg(child);};
    $('fGps').onclick=()=>{f.len='';draw();};
    if($('mCut'))$('mCut').onclick=()=>{closeModal();cutDialog(child,ll);};
    if($('mPole'))$('mPole').onclick=()=>{closeModal();insertOn(child,ll,'pole');};
    const save1=all=>{const set=n=>{delete n.core;if(f.cores){n.cores=f.cores;n.work=f.work.slice();n.bad=f.bad.slice();}else{delete n.cores;delete n.work;delete n.bad;}};
      set(child);if(f.len===''||isNaN(+f.len))delete child.len;else child.len=Math.max(0,+f.len);
      let k=0;if(all&&$('fAll')&&$('fAll').checked)section(child).forEach(n=>{set(n);k++;});return k;};
    $('fOk').onclick=()=>{keep();const k=save1(true);closeModal();render();toast('Fiber saved'+(k?' · '+(k+1)+' segments updated':''));};
  };
  draw();

function newNode(type,lat,lng,parent){
  let port=0;
  if(SRC.has(type)||type==='mark')parent=null;
  if(parent){port=nextPort(parent);if(port<0){toast(parent.name+' has no free port');port=ports(parent)-1;}}
  const n={id:uid(),type,lat,lng,name:TYPES[type].pre+(S.seq++),parent:parent?parent.id:null,port,folder:S.curFolder,created:new Date().toISOString()};
  if(type==='plc')n.ratio='1x8';
  if(type==='fbt')n.ratio='70/30';
  if(type==='olt')n.power=S.set.oltPower;
  if(type==='sw')n.power=S.set.swPower;
  if(type==='liu'){n.lp=12;n.lport={work:[],bad:[],lbl:[]};}
  if(parent&&!(type==='liu'&&SRC.has(parent.type))){if(parent.cores){n.cores=parent.cores;n.work=wk(parent);n.bad=bad(parent);}else if(S.set.defCores){n.cores=S.set.defCores;n.work=[];}}
  return n;
}
function addNode(type,lat,lng,opts){
  opts=opts||{};
  const parent=opts.parent!==undefined?opts.parent:(sel&&R.by[sel]?R.by[sel]:null);
  const n=newNode(type,lat,lng,parent);Object.assign(n,opts.extra||{});
  S.nodes.push(n);if(!opts.keepSel)sel=n.id;render();
  if(!opts.quiet){const c=R.C[n.id];toast(n.name+' added'+(c&&c.seg?' · '+fmtD(c.seg)+' from '+R.by[n.parent].name:''));}
  return n;
}
function insertOn(child,ll,type,extra){
  const p=R.by[child.parent];if(!p)return;
  const pt=proj(ll,p,child);
  const n=newNode(type,pt.lat,pt.lng,null);n.parent=p.id;n.port=child.port||0;n.folder=child.folder;Object.assign(n,extra||{});
  if(child.cores){n.cores=child.cores;n.work=wk(child);n.bad=bad(child);}
  if(child.len!=null&&child.len!==''){const L0=+child.len;n.len=+(L0*pt.t).toFixed(1);child.len=+(L0*(1-pt.t)).toFixed(1);}
  child.parent=n.id;child.port=0;S.nodes.push(n);sel=n.id;render();
  toast(n.name+' inserted · '+fmtD(R.C[n.id].seg)+' from '+p.name);return n;
}

function setParent(ch,p){

/* ============ edit page ============ */

     <div class="btns"><button class="btn" id="sAdd">＋ Add splice</button><button class="btn" id="s12">Auto 1:1 (12 colours)</button>${(ed.splices||[]).length?'<button class="btn d" id="sClr">Clear</button>':''}</div></div>`:'';
  const d=new Date(ed.created),pz=x=>String(x).padStart(2,'0');

  openPage({head:`<button class="hb" id="eBack">←</button><button class="hb" id="eFold" style="width:auto;font-size:14px;gap:8px;padding:0 6px">📁 ${esc(folderName(ed.folder))}</button><span class="ttl"></span><button class="hb" id="eDel">⋮</button><button class="hb" id="eSave">💾</button>`,

     <label class="f">Fiber length (m) – GPS ${fmtD(hav(p,ed))}</label><input id="eLen" type="number" step="0.1" placeholder="${hav(p,ed).toFixed(1)} (GPS)" value="${ed.len==null?'':ed.len}">

     <div class="sqs"><button class="sq" id="gCopy">⧉</button><button class="sq" id="gGps" title="Use my GPS">◎</button><button class="sq" id="gMove" title="Move on map">✋</button></div></div>

  loadThumbs(ed,$('eImgs'),true);
  const grab=()=>{ed.name=$('eName').value;ed.desc=$('eDesc').value;ed.phone=$('ePhone').value;
    if($('ePow'))ed.power=num($('ePow').value,S.set.oltPower);

    ['l1','l2'].forEach(k=>{const e=$('e'+k.toUpperCase());if(e){if(e.value==='')delete ed[k];else ed[k]=+e.value;}});
    if($('eCut'))ed.cut=$('eCut').value==='1';
    if($('ePort'))ed.port=+$('ePort').value;
    if(ed.cores){delete ed.core;ed.work=wk(ed);ed.bad=bad(ed);}
    if(ed.type==='liu'){ed.lport=ed.lport||{work:[],bad:[],lbl:[]};document.querySelectorAll('[data-lbl]').forEach(x=>{ed.lport.lbl[+x.dataset.lbl]=x.value;});}
    if($('eLen')){const v=$('eLen').value;if(v===''||isNaN(+v))delete ed.len;else ed.len=Math.max(0,+v);}
    ed.lat=num($('eLat').value,ed.lat);ed.lng=num($('eLng').value,ed.lng);
    const dt=new Date(($('eDate').value||'1970-01-01')+'T'+($('eTime').value||'00:00:00'));if(!isNaN(dt)&&$('eDate').value)ed.created=dt.toISOString();};
  const redraw=()=>{grab();editPage(id,true);};
  $('eType').onchange=()=>{grab();ed.type=$('eType').value;if(ed.type==='plc'&&!PLC[ed.ratio])ed.ratio='1x8';if(ed.type==='fbt'&&!FBT_TABLE[ed.ratio])ed.ratio='70/30';if(SRC.has(ed.type)||ed.type==='mark'){ed.parent=null;}if(SRC.has(ed.type)&&ed.power==null)ed.power=ed.type==='sw'?S.set.swPower:S.set.oltPower;delete ed.loss;delete ed.l1;delete ed.l2;editPage(id,true);};
  document.querySelectorAll('[data-ecc]').forEach(b=>b.onclick=()=>{grab();const v=+b.dataset.ecc;if(ed.cores===v){delete ed.cores;delete ed.work;}else{ed.cores=v;ed.work=wk(ed);}editPage(id,true);});
  bindCoreList('data-es',ed,()=>{$('eWn').innerHTML=stCount(ed,ed.cores);});
  if($('eWall'))$('eWall').onclick=()=>{grab();ed.work=Array.from({length:ed.cores},(_,i)=>i).filter(i=>!bad(ed).includes(i));editPage(id,true);};
  if($('eWnone'))$('eWnone').onclick=()=>{grab();ed.work=[];ed.bad=[];editPage(id,true);};

    $('edD').onclick=()=>{closeModal();closePage();delNode(R.by[id]);};
    $('edC').onclick=()=>{closeModal();grab();const c=Object.assign(JSON.parse(JSON.stringify(ed)),{id:uid(),name:ed.name+' copy',parent:null,images:[],created:new Date().toISOString()});S.nodes.push(c);closePage();sel=c.id;render();toast('Duplicated');};};
  $('eSave').onclick=()=>{grab();commitEdit(id);closePage();toast('Saved');};

    for(const f of fs){try{const d=await shrink(f),iid=uid();await imgPut(iid,d);ed.images.push(iid);}catch(err){toast('Could not add photo');}}
    const n0=R.by[id];if(n0){n0.images=ed.images.slice();save();}editPage(id,true);};

function commitEdit(id){
  const n=R.by[id];if(!n||!ed)return;
  if(ed.parent&&R.by[ed.parent]&&isDesc(R.by[ed.parent],n))ed.parent=n.parent;
  Object.keys(n).forEach(k=>delete n[k]);Object.assign(n,ed,{id});
  sel=id;render();
}

/* ============ pages ============ */
function openPage(o){$('pgHead').innerHTML=o.head||`<button class="hb" id="pgBack">←</button><span class="ttl">${o.title||''}</span>${o.extra||''}`;$('pgBody').innerHTML=o.body;$('page').classList.add('show');$('pgBody').scrollTop=0;pageBack=o.back||closePage;const b=$('pgBack')||$('eBack');if(b)b.onclick=()=>pageBack();}
function closePage(){$('page').classList.remove('show');pageBack=null;}
function reportPage(n){
  const path=pathTo(n),st=S.set,root=path[0],rc=R.C[root.id];
  if(!SRC.has(root.type)){openPage({title:'Power path',body:`<div class="box">This route is not connected to an OLT or Switch (source), so power cannot be calculated. Use ⋮ → Connect to… on the first marker.</div>`});return;}
  let rows=`<tr><td>${TYPES[root.type].icon} ${esc(root.name)} Tx</td><td></td><td>${fmtP(rc.pin)}</td></tr><tr><td>&nbsp; connector</td><td>−${st.connLoss.toFixed(2)}</td><td>${fmtP(rc.out[0])}</td></tr>`,fib=0,fl=0,sp=0,spc=0,spl=0,con=st.connLoss;
  for(let i=1;i<path.length;i++){
    const x=path[i],c=R.C[x.id],l=c.seg/1000*st.lossKm;fib+=c.seg;fl+=l;
    rows+=`<tr><td class="muted">&nbsp; fiber ${fmtD(c.seg)}${x.len!=null?'*':''}${x.cores?' · '+x.cores+'F':''}${x.cores?' '+wk(x).map(k=>`<span class="cdot" style="background:${coreCol(k)}"></span>`).join(''):''}</td><td>−${l.toFixed(2)}</td><td>${fmtP(c.pin)}</td></tr>`;
    if(x.type==='pole'||x.type==='mark')continue;
    if(i===path.length-1&&x.type!=='ont'){rows+=`<tr><td><b>${esc(x.name)}</b> input</td><td></td><td><b>${fmtP(c.pin)}</b></td></tr>`;break;}
    const port=(path[i+1]&&x.type==='fbt')?(path[i+1].port?1:0):0,ls=nodeLoss(x,port);
    if(x.type==='joint'){sp+=ls;spc++;}else if(x.type==='plc'||x.type==='fbt')spl+=ls;else if(x.type==='ont')con+=ls;
    const lbl=x.type==='fbt'?'coupler '+x.ratio+' Port'+(port+1):x.type==='plc'?'splitter '+x.ratio:x.type==='joint'?'splice':x.type==='ont'?'ONT connector':'';
    rows+=`<tr><td>${esc(x.name)} <span class="muted">${lbl}</span></td><td>−${ls.toFixed(2)}</td><td>${fmtP(x.type==='ont'?c.rx:c.out[port])}</td></tr>`;
  }
  const c=R.C[n.id],end=n.type==='ont'?c.rx:c.pin;
  const body=`<div class="box"><table><tr><th>Item</th><th>Loss dB</th><th>Power</th></tr>${rows}</table></div>
   <div class="box"><h5>Budget</h5><div class="kv"><b>Fiber length</b><span>${fmtD(fib)}</span><b>Fiber loss (${st.lossKm} dB/km @${st.wl} nm)</b><span>${fmtL(fl)}</span>
   <b>Joints (${spc})</b><span>${fmtL(sp)}</span><b>Couplers / splitters</b><span>${fmtL(spl)}</span><b>Connectors</b><span>${fmtL(con)}</span>
   <b>Total loss</b><span>${fmtL(rc.pin-end)}</span><b>${n.type==='ont'?'ONT Rx':'Power here'}</b><span>${fmtP(end)}</span></div>
   <div class="muted" style="margin-top:6px">* = fiber length edited by hand</div>
   ${n.type==='ont'?`<div style="margin-top:8px"><span class="tag ${status(end)}">${STXT[status(end)]}</span></div>`:''}
   <div class="btns"><button class="btn" id="rCopy">⧉ Copy report</button><button class="btn" id="rTrace">🌈 Core trace</button></div></div>`;
  openPage({title:'Power path → '+esc(n.name),body});
  $('rCopy').onclick=()=>copy($('pgBody').innerText);
  $('rTrace').onclick=()=>tracePage(n);
}
function listPage(q){
  openPage({title:'',head:`<button class="hb" id="pgBack">←</button><input id="lq" placeholder="Search markers or lat,lng" style="border:0;background:none;flex:1" value="${esc(q||'')}"><button class="hb" id="lPoles" title="Show route points">${S._lp?'●':'○'}</button>`,body:`<div id="lres"></div>`});
  const run=()=>{
    const s=$('lq').value.trim().toLowerCase();let h='';
    const m=s.match(/^(-?\d+(\.\d+)?)\s*[, ]\s*(-?\d+(\.\d+)?)$/);
    if(m)h+=`<div class="box click" id="goLL" style="cursor:pointer">📍 Go to ${m[1]}, ${m[3]}</div>`;
    const ord=[],seen=new Set(),walk=n=>{if(seen.has(n.id))return;seen.add(n.id);ord.push(n);(R.kids[n.id]||[]).slice().sort((a,b)=>(a.port||0)-(b.port||0)).forEach(walk);};
    S.nodes.filter(n=>!n.parent||!R.by[n.parent]).forEach(walk);S.nodes.forEach(walk);
    const rows=ord.filter(n=>(S._lp||s||n.type!=='pole')&&(!s||(n.name+' '+(n.desc||'')+' '+splText(n)+' '+(n.phone||'')).toLowerCase().includes(s))).map(n=>{const c=R.C[n.id]||{},v=n.type==='ont'?c.rx:c.pin,st=status(c.rx);
      return `<tr class="click" data-go="${n.id}"><td><span class="cdot" style="background:${pinColor(n,c)}"></span>${esc(n.name)}<div class="muted">${TYPES[n.type].short}${n.ratio?' '+n.ratio:''}${n.desc?' · '+esc(n.desc.split('\n')[0]).slice(0,40):''}</div></td><td>${fmtD(c.dist)}</td><td>${v==null?'—':v.toFixed(2)}${n.type==='ont'?`<br><span class="tag ${st}">${STXT[st]}</span>`:''}</td></tr>`;}).join('');
    h+=`<div class="box"><table><tr><th>Marker (${S.nodes.length})</th><th>From start</th><th>In / Rx dBm</th></tr>${rows||'<tr><td colspan=3 class="muted">Nothing found</td></tr>'}</table></div>`;
    $('lres').innerHTML=h;
    if($('goLL'))$('goLL').onclick=()=>{closePage();map.setView([+m[1],+m[3]],18);};
    document.querySelectorAll('[data-go]').forEach(r=>r.onclick=()=>{const n=R.by[r.dataset.go];closePage();sel=n.id;map.setView([n.lat,n.lng],Math.max(map.getZoom(),18));render();});
  };
  $('lq').oninput=run;$('lPoles').onclick=()=>{S._lp=!S._lp;$('lPoles').textContent=S._lp?'●':'○';run();};run();
  return $('lq');
}
function traceCore(path,start){
  const out=[];let cur=start;
  for(let i=1;i<path.length;i++){
    const seg=path[i],prev=path[i-1];let note='';
    if(i>1&&cur!=null){
      const tube=Math.floor(cur/12);let col=FIBER[cur%12][0];
      if(prev.type==='joint'&&(prev.splices||[]).length){
        const sp=prev.splices.find(x=>x.a===col);
        if(sp){note=`Splice ${col} → ${sp.b}`;col=sp.b;}else note=`No splice entry for ${col} – assumed ${col} to ${col.toLowerCase()}`;
      }else if(prev.type==='joint')note=`Joint: no colour splices saved – assumed ${col} to ${col.toLowerCase()}`;
      else if(prev.type==='fbt'||prev.type==='plc')note=`${TYPES[prev.type].short} output fiber`;
      const ci=FIBER.findIndex(f=>f[0]===col);
      if(ci<0||ci>11)cur=null;else{cur=ci+12*tube;if(seg.cores&&cur>=seg.cores)cur=ci<seg.cores?ci:null;}
      if(cur==null)note+=(note?' · ':'')+'core not available in this cable';
    }
    if(seg.cores&&cur!=null&&cur>=seg.cores)cur=null;
    if(i>1&&prev.type==='liu'&&cur!=null){const o=prev.lport||{};note+=(note?' · ':'')+'LIU port '+(cur+1)+((o.lbl||[])[cur]?' ('+o.lbl[cur]+')':'')+(stOf(o,cur)==='f'?' FAULTY PORT':'');}
    out.push({seg,prev,core:cur,note,work:seg.cores?wk(seg).includes(cur):null,bad:seg.cores?bad(seg).includes(cur):false});
  }
  return out;
}
function tracePage(n,start){

  const first=path[1];
  if(start==null){const w=wk(first);start=w.length?w[0]:0;}
  const tr=traceCore(path,start),C=R.C;
  let h=`<div class="box"><h5>Start core at ${esc(path[0].name)}</h5>`;
  if(first.cores)h+=Array.from({length:first.cores},(_,i)=>`<button class="chip2${i===start?' on':''}" data-st="${i}"><span class="cdot" style="background:${coreCol(i)};margin:0"></span>${i+1} ${FIBER[i%12][0]}${wk(first).includes(i)?' ✓':''}</button>`).join('');

  if(path[0].type==='liu'){const o=path[0].lport||{};h+='';}
  h+=nodeRow(path[0],`<div class="muted">${path[0].type==='liu'?'LIU port '+(start+1)+' '+FIBER[start%12][0]+(((path[0].lport||{}).lbl||[])[start]?' – '+esc(path[0].lport.lbl[start]):'')+' · ':''}Start (${SRC.has(path[0].type)?'source':'no power source'}) · Tx ${fmtP(C[path[0].id]&&C[path[0].id].pin)}</div>`);
  let nBad=0;

      ${t.note?`<div style="color:#ffe082">↳ ${esc(t.note)}</div>`:''}
      <b style="color:#fff">${t.core!=null?`<span class="cdot" style="background:${col}"></span>Core ${t.core+1} ${FIBER[t.core%12][0]}${t.seg.cores>12?' (tube '+(t.core<12?'1':'2')+')':''}`:'Core unknown'}</b>
      ${t.bad?' <span class="tag low">FAULTY</span>':t.work===true?' <span class="tag ok">working</span>':t.work===false?' <span class="tag warn">not marked working</span>':''}<br>
      ${t.seg.cores?t.seg.cores+'F cable':'cable not set'} · ${fmtD(c.seg)}${t.seg.len!=null?' (edited)':''} · ${fmtD(c.dist)} from start
      ${wk(t.seg).length?`<br>Working: ${wk(t.seg).map(k=>`<span class="cdot" style="background:${coreCol(k)}"></span>${k+1}`).join(' ')}`:''}
    </div></div>`;
    const x=t.seg,last=i===tr.length-1;
    const pw=x.type==='ont'?'Rx '+fmtP(c.rx):'In '+fmtP(c.pin);
    h+=nodeRow(x,`<div class="muted">${pw}${last&&t.core!=null?` · arrives on <b style="color:#fff">${t.core+1} ${FIBER[t.core%12][0]}</b>`:''}${x.type==='joint'&&(x.splices||[]).length&&!last?' · '+x.splices.length+' splices saved':''}</div>`);
  });
  h+=`</div><div class="box"><div class="kv"><b>Total fiber</b><span>${fmtD(C[n.id].dist)}</span><b>Segments</b><span>${tr.length}</span><b>Core at end</b><span>${tr[tr.length-1].core!=null?(tr[tr.length-1].core+1)+' '+FIBER[tr[tr.length-1].core%12][0]:'—'}</span></div>
   ${nBad?`<div class="muted" style="margin-top:6px;color:#ffe082">${nBad} segment(s): this core is faulty or not marked Working. Use 🔁 Change core on that fiber.</div>`:''}
   <div class="btns"><button class="btn p" id="trMap">🗺 Show on map</button><button class="btn" id="trCopy">⧉ Copy</button></div></div>`;
  openPage({title:'Core trace → '+esc(n.name),body:h});

function addMeas(p){
  if(meas.length>=2)meas=[];meas.push(p);measLayer.clearLayers();
  meas.forEach(m=>L.circleMarker([m.lat,m.lng],{radius:8,color:'#fff',weight:3,fillColor:'#e91e63',fillOpacity:1}).addTo(measLayer));
  if(meas.length===2)L.polyline(meas.map(m=>[m.lat,m.lng]),{color:'#e91e63',weight:3,dashArray:'6 6'}).addTo(measLayer);
  renderInfo();
}
function measHtml(){
  if(meas.length<2)return `<div class="t">📏 Measure</div><div class="d">Now tap the end point or marker.</div>`;
  const [a,b]=meas,d=hav(a,b);let x='';
  if(a.node&&b.node){const na=R.by[a.node],nb=R.by[b.node],fd=na&&nb?fiberBetween(na,nb):null;
    x=`<div class="d">${esc(na.name)} → ${esc(nb.name)}</div><div class="f">Along fiber: ${fd==null?'not connected':fmtD(fd)+' · loss '+fmtL(fd/1000*S.set.lossKm)}</div>`;
    const ca=R.C[na.id],cb=R.C[nb.id];if(ca&&cb&&ca.pin!=null&&cb.pin!=null)x+=`<div class="f">Power difference: ${fmtL(Math.abs(ca.pin-cb.pin))}</div>`;}
  return `<div class="t" style="font-size:20px">${fmtD(d)}</div><div class="d">Straight line (GPS)</div>${x}<div class="muted">Tap another point to measure again · 📏 to finish</div>`;
}

/* ============ GPS ============ */
let gpsQ=[];
function startGps(cb){
  if(!navigator.geolocation){toast('GPS not available');return;}
  if(watchId==null){
    watchId=navigator.geolocation.watchPosition(onPos,err=>{
      toast({1:'Location permission denied – allow Location for SLVS FTTH Map',2:'GPS position unavailable – turn on Location / go outdoors',3:'GPS timeout'}[err.code]||err.message);
      if(err.code===1){navigator.geolocation.clearWatch(watchId);watchId=null;gpsQ=[];}
    },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  }
  if(cb){if(gps&&Date.now()-gps.t<8000)cb(gps);else{toast('Getting GPS fix…');gpsQ.push(cb);}}
}
function onPos(pos){
  gps={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy,t:Date.now()};
  const ll=[gps.lat,gps.lng];
  if(!gpsMk){gpsMk=L.marker(ll,{icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],html:'<div class="gpsdot"></div>'}),interactive:false,zIndexOffset:3000}).addTo(map);
    gpsCirc=L.circle(ll,{radius:gps.acc,color:'#2979ff',weight:1,fillOpacity:.1,interactive:false}).addTo(map);}
  else{gpsMk.setLatLng(ll);gpsCirc.setLatLng(ll).setRadius(gps.acc);}
  if(follow)map.panTo(ll);
  const g=$('gpsbar');g.style.display='block';g.innerHTML='GPS ±'+Math.round(gps.acc)+' m'+(rec?`<br><b style="color:#ff8a80">● REC ${recCount} pts · ${fmtD(recDist)}</b>`:'');
  if(gpsQ.length){const q=gpsQ;gpsQ=[];q.forEach(f=>f(gps));}
  if(rec)recordStep();
}
function recordStep(){
  if(gps.acc>S.set.recAcc)return;
  if(!recLast){recLast={lat:gps.lat,lng:gps.lng};return;}
  const d=hav(recLast,gps);
  if(d>=S.set.recInt){addNode('pole',gps.lat,gps.lng,{quiet:true});recDist+=d;recCount++;recLast={lat:gps.lat,lng:gps.lng};}
}
function toggleRec(){
  if(rec){rec=false;$('xRec').classList.remove('rec');toast('Recording stopped · '+recCount+' points · '+fmtD(recDist));render();return;}
  if(!sel){modal(`<h3>Walk &amp; record route</h3><p class="muted">Select the start marker first (OLT, joint or coupler), or create the start at your GPS position.</p>
     ${mitem('⚡','Start with OLT at my GPS','','rS1')}${mitem('⇄','Start with Switch at my GPS','','rS3')}${mitem('•','Start with a route point at my GPS','','rS2')}<div class="mfoot"><button data-close>CANCEL</button></div>`);
    $('rS1').onclick=()=>{closeModal();startGps(p=>{addNode('olt',p.lat,p.lng,{parent:null});toggleRec();});};
    $('rS3').onclick=()=>{closeModal();startGps(p=>{addNode('sw',p.lat,p.lng,{parent:null});toggleRec();});};
    $('rS2').onclick=()=>{closeModal();startGps(p=>{addNode('pole',p.lat,p.lng,{parent:null});toggleRec();});};return;}
  startGps();rec=true;follow=true;$('bLoc').classList.add('on');recDist=0;recCount=0;
  const s=R.by[sel];recLast=s?{lat:s.lat,lng:s.lng}:null;$('xRec').classList.add('rec');
  toast('Recording – walk along the cable. A point is added every '+S.set.recInt+' m.');
}
window.cutAtGps=function(){
  startGps(p=>{
    let best=null;S.nodes.forEach(n=>{if(!n.parent||!R.by[n.parent])return;const q=proj(p,R.by[n.parent],n),d=hav(p,q);if(!best||d<best.d)best={n,d};});
    if(best&&best.d<60){cutDialog(best.n,{lat:p.lat,lng:p.lng});return;}
    toast('No fiber within 60 m – joint placed at GPS');addNode('joint',p.lat,p.lng,{extra:{cut:true}});
  });
};

/* ============ dialogs / export ============ */
function mitem(ic,t,s,id){return `<div class="mitem" id="${id}"><span class="ic">${ic}</span><div><b>${t}</b>${s?`<small>${s}</small>`:''}</div></div>`;}
function modal(h){$('mBox').innerHTML=h;$('modal').classList.add('show');$('mBox').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);}
function closeModal(){$('modal').classList.remove('show');}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
function backupMenu(){
  modal(`<h3>Data backup</h3>${mitem('💾','Export backup','All markers, folders, settings and photos (JSON)','b1')}${mitem('📂','Import backup','Replace the map with a backup file','b2')}${mitem('🗑','Clear whole map','Delete all markers on this phone','b3')}<div class="mfoot"><button data-close>CANCEL</button></div>`);
  $('b1').onclick=async()=>{closeModal();toast('Preparing backup…');const imgs={};for(const n of S.nodes)for(const id of (n.images||[])){const d=await imgGet(id);if(d)imgs[id]=d;}
    S.lastBackup=new Date().toISOString();save();
    exportFile('slvs-ftth-backup-'+stamp()+'.json',JSON.stringify({app:'SLVS FTTH Map',version:3,nodes:S.nodes,folders:S.folders,set:S.set,seq:S.seq,images:imgs}),'application/json');};
  $('b2').onclick=()=>{closeModal();$('fileIn').click();};
  $('b3').onclick=()=>{modal(`<h3>Clear the whole map?</h3><p class="muted">All markers will be deleted from this phone. Export a backup first.</p><div class="mfoot"><button data-close>CANCEL</button><button id="cOk" style="color:var(--red)">DELETE ALL</button></div>`);
    $('cOk').onclick=()=>{S.nodes.forEach(n=>(n.images||[]).forEach(imgDel));S.nodes=[];S.seq=1;sel=null;closeModal();render();};};
}
function shareMenu(){
  modal(`<h3>Share / export</h3>${mitem('🌍','KML – Google Earth / Maps','Markers and fiber routes','x1')}${mitem('📄','CSV – Excel','Markers with distance and power','x2')}${mitem('💾','Full backup (JSON)','To restore on another phone','x3')}${sel?mitem('📍','Share selected marker','Text with location link','x4'):''}<div class="mfoot"><button data-close>CANCEL</button></div>`);
  $('x1').onclick=()=>{closeModal();exportFile('slvs-ftth-'+stamp()+'.kml',kml(),'application/vnd.google-earth.kml+xml');};
  $('x2').onclick=()=>{closeModal();exportFile('slvs-ftth-'+stamp()+'.csv',csv(),'text/csv');};
  $('x3').onclick=()=>{closeModal();backupMenu();};
  if($('x4'))$('x4').onclick=()=>{closeModal();$('iCopy').click();};
}
$('fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f);e.target.value='';};
async function doImport(t){
  try{const d=JSON.parse(t);if(!Array.isArray(d.nodes))throw 0;
    if(d.images)for(const k in d.images)await imgPut(k,d.images[k]);
    S.nodes=d.nodes.filter(n=>n&&n.id&&isFinite(n.lat)&&isFinite(n.lng)&&TYPES[n.type]);
    S.folders=d.folders&&d.folders.length?d.folders:[{id:'def',name:'Default folder',vis:true}];
    S.set=Object.assign({},DEF,d.set||{});S.seq=d.seq||S.nodes.length+1;
    S.nodes.forEach(n=>{if(!S.folders.find(f=>f.id===n.folder))n.folder=S.folders[0].id;if(!n.created)n.created=new Date().toISOString();if(n.notes&&!n.desc)n.desc=n.notes;});
    S.curFolder=S.folders[0].id;sel=null;setMapType(S.set.mapType);render();fitAll();toast('Imported '+S.nodes.length+' markers');}
  catch(e){toast('Not a valid SLVS FTTH backup');}
}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
function exportFile(name,text,mime){
  if(window.Android&&Android.saveFile){Android.saveFile(name,text);return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);toast('Saved '+name);}
  catch(e){toast('Export failed');}
}
function copy(t){if(window.Android&&Android.copy){Android.copy(t);return;}if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy failed'));}
function csv(){
  const h=['Name','Type','Ratio','Folder','Latitude','Longitude','Connected from','Port','Cable','Working cores','Faulty cores','Length source','Segment m','From start m','Input dBm','Output dBm','Output2 dBm','ONT Rx dBm','Status','Cut joint','Splices','Phone','Description','Created'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',f=v=>v==null?'':v.toFixed(2);
  return [h.join(',')].concat(S.nodes.map(n=>{const c=R.C[n.id]||{},p=R.by[n.parent];
    return [n.name,TYPES[n.type].label,n.ratio||'',folderName(n.folder),n.lat.toFixed(7),n.lng.toFixed(7),p?p.name:'',p?portLabel(p,n.port):'',n.cores?n.cores+'F':'',n.cores?workText(n):'',n.cores?bad(n).map(i=>(i+1)+' '+FIBER[i%12][0]).join(', '):'',p?(n.len!=null?'Edited':'GPS'):'',f(c.seg),f(c.dist),f(c.pin),f(c.out&&c.out[0]),f(c.out&&c.out[1]),f(c.rx),n.type==='ont'?STXT[status(c.rx)]:'',n.cut?'Yes':'',splText(n).replace(/\n/g,'; '),n.phone||'',n.desc||'',fmtDate(n.created)].map(q).join(',');})).join('\n');
}
function kml(){
  const x=esc;let pm='';
  const k=c=>{const h=c.replace('#','');return 'ff'+h.slice(4,6)+h.slice(2,4)+h.slice(0,2);};
  pm+=`<Style id="fiber"><LineStyle><color>ffd4b800</color><width>4</width></LineStyle></Style>`;
  S.folders.forEach(fo=>{
    let inner='';
    S.nodes.filter(n=>n.folder===fo.id).forEach(n=>{const c=R.C[n.id]||{};
      const d=[TYPES[n.type].label+(n.ratio?' '+n.ratio:''),n.desc,splText(n),'From start: '+fmtD(c.dist),'In: '+fmtP(c.pin),n.type==='ont'?'Rx: '+fmtP(c.rx):'',n.cut?'FIBER CUT JOINT':'',n.phone?'Phone: '+n.phone:'',fmtDate(n.created)].filter(Boolean).join('\n');
      inner+=`<Placemark><name>${x(n.name)}</name><description>${x(d)}</description><Style><IconStyle><color>${k(pinColor(n,c))}</color><scale>${n.type==='pole'?0.5:1}</scale><Icon><href>http://maps.google.com/mapfiles/kml/pushpin/wht-pushpin.png</href></Icon></IconStyle></Style><Point><coordinates>${n.lng},${n.lat},0</coordinates></Point></Placemark>`;
      const p=R.by[n.parent];if(p)inner+=`<Placemark><name>${x(p.name+' → '+n.name)}</name><styleUrl>#fiber</styleUrl><description>${x(fmtD(c.seg)+(n.cores?' · '+cableText(n):''))}</description><LineString><tessellate>1</tessellate><coordinates>${p.lng},${p.lat},0 ${n.lng},${n.lat},0</coordinates></LineString></Placemark>`;});
    pm+=`<Folder><name>${x(fo.name)}</name>${inner}</Folder>`;});
  return `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>SLVS FTTH Map</name>${pm}</Document></kml>`;
}
function fitAll(){const v=S.nodes.filter(visible);if(!v.length)return;map.fitBounds(L.latLngBounds(v.map(n=>[n.lat,n.lng])).pad(.2),{maxZoom:19});}

/* ============ back button (Android) ============ */
window.slvsBack=function(){
  if($('imgView').classList.contains('show')){$('imgView').classList.remove('show');return true;}
  if($('modal').classList.contains('show')){closeModal();return true;}
  if($('drawer').classList.contains('show')){closeDrawer();return true;}
  if($('page').classList.contains('show')){pageBack&&pageBack();return true;}
  if(place){endPlace();return true;}
  if(tool){setTool(tool);return true;}
  if(pendingParent){pendingParent=null;hint('');return true;}
  if(sel){sel=null;render();return true;}
  return false;
};

/* ============ wire up ============ */
$('tMenu').onclick=drawer;
$('tFilter').onclick=filterMenu;
$('tList').onclick=()=>listPage('');
$('tSearch').onclick=()=>{const i=listPage('');setTimeout(()=>i.focus(),60);};
$('tShare').onclick=shareMenu;
$('bLoc').onclick=()=>{follow=!follow||!gps;$('bLoc').classList.toggle('on',follow);startGps(p=>map.setView([p.lat,p.lng],Math.max(map.getZoom(),18)));};
map.on('dragstart',()=>{if(follow&&!place){follow=false;$('bLoc').classList.remove('on');}});
$('xMeas').onclick=()=>setTool('meas');
$('xCut').onclick=()=>setTool('cut');
$('xRec').onclick=toggleRec;
$('xLbl').onclick=()=>{S.set.showLabels=!S.set.showLabels;$('xLbl').classList.toggle('on',S.set.showLabels);render();};
$('xLbl').classList.toggle('on',S.set.showLabels);
render();
if(S.nodes.length)fitAll();else{startGps(p=>map.setView([p.lat,p.lng],18));}
</script>
